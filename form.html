<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form for WDD 131. Rate a product, choose useful features, and submit your review.">
  <meta name="author" content="Humphrey Darko">
  <title>Product Review | WDD 131</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>

<body>
  <header>
    <h1>Product Review</h1>
    <p>Share your experience with a recently installed product.</p>
  </header>

  <main>
    <form method="get" action="review.html">
      <p class="required-note"><span class="required">*</span> Required fields</p>

      <div class="field">
        <label for="product">Product Name <span class="required">*</span></label>
        <select id="product" name="product" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <fieldset class="field">
        <legend>Overall Rating <span class="required">*</span></legend>
        <div class="rating">
          <div class="choice">
            <input type="radio" id="rating-1" name="rating" value="1" required>
            <label for="rating-1">1 ☆</label>
          </div>
          <div class="choice">
            <input type="radio" id="rating-2" name="rating" value="2" required>
            <label for="rating-2">2 ☆</label>
          </div>
          <div class="choice">
            <input type="radio" id="rating-3" name="rating" value="3" required>
            <label for="rating-3">3 ☆</label>
          </div>
          <div class="choice">
            <input type="radio" id="rating-4" name="rating" value="4" required>
            <label for="rating-4">4 ☆</label>
          </div>
          <div class="choice">
            <input type="radio" id="rating-5" name="rating" value="5" required>
            <label for="rating-5">5 ☆</label>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label for="installed">Date of Installation <span class="required">*</span></label>
        <input type="date" id="installed" name="installed" required>
      </div>

      <fieldset class="field">
        <legend>Useful Features</legend>
        <p class="hint">Check all that apply.</p>
        <div class="checks">
          <div class="choice">
            <input type="checkbox" id="feat-durability" name="features" value="durability">
            <label for="feat-durability">Durability</label>
          </div>
          <div class="choice">
            <input type="checkbox" id="feat-ease" name="features" value="ease-of-use">
            <label for="feat-ease">Ease of Use</label>
          </div>
          <div class="choice">
            <input type="checkbox" id="feat-performance" name="features" value="performance">
            <label for="feat-performance">Performance</label>
          </div>
          <div class="choice">
            <input type="checkbox" id="feat-design" name="features" value="design">
            <label for="feat-design">Design</label>
          </div>
        </div>
      </fieldset>

      <div class="field">
        <label for="review">Written Review</label>
        <textarea id="review" name="review" rows="5" placeholder="What did you like or dislike?"></textarea>
      </div>

      <div class="field">
        <label for="username">Your Name</label>
        <input type="text" id="username" name="username" autocomplete="name">
      </div>

      <input type="submit" value="Post Review">
    </form>
  </main>

  <footer>
    <p>© <span id="currentyear"></span> Humphrey Darko, Minnesota</p>
    <p>Last Modified: <span id="lastmodified"></span></p>
  </footer>
</body>
</html>
